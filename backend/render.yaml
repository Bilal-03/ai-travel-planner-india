services:
  - type: web
    name: yatraai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: RAILRADAR_API_KEY
        sync: false
      - key: SKYSCANNER_RAPIDAPI_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TRIP_JOB_SECRET
        sync: false
      - key: AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ACCOUNT_SESSION_TTL_SECONDS
        value: "2592000"
      - key: FRONTEND_URL
        sync: false
      - key: FLIGHT_PROVIDER
        value: legacy
      - key: HOTEL_PROVIDER
        value: none
      - key: PLACES_PROVIDER
        value: overpass
      - key: ROUTES_PROVIDER
        value: osrm
      - key: RAIL_PROVIDER
        value: legacy
      - key: BUS_PROVIDER
        value: none
      - key: WEATHER_PROVIDER
        value: openweather
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "20"
      - key: PROVIDER_MAX_RETRIES
        value: "1"
      - key: PROVIDER_RETRY_BACKOFF_SECONDS
        value: "0.25"
      - key: PROVIDER_CIRCUIT_FAILURE_THRESHOLD
        value: "3"
      - key: PROVIDER_CIRCUIT_COOLDOWN_SECONDS
        value: "30"
